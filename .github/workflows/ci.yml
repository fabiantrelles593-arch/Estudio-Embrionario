name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # un fallo en 3.12 no cancela 3.13: se ven los dos resultados
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          # PyTorch solo para CPU antes que el resto: así pip no baja la versión con CUDA (mucho más pesada)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      # La instalación de Chromium depende de la red y de apt y ha fallado varias veces sin fallo de código: se
      # reintenta hasta 3 veces. Si falla las 3, el trabajo sigue en rojo (no se relaja la comprobación).
      - name: Instalar Playwright y Chromium (pruebas del prototipo en navegador)
        run: |
          pip install "playwright>=1.40"
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "intento $i fallido; reintento en $((i * 20)) s"
            sleep $((i * 20))
          done
          exit 1
      - name: Pruebas
        run: pytest

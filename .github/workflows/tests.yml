name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest tests -v
      - name: Run synthetic demo pipeline
        run: python src/demo_pipeline.py
      - name: Audit generated synthetic dataset
        run: python src/audit_dataset.py demo/synthetic_morphology.csv --out demo/synthetic_audit.json --strict
      - name: Create synthetic image manifest
        run: python src/create_synthetic_manifest.py
      - name: Analyze synthetic manifest with advanced sensitivity
        run: python -m src.analyze_manifest demo/synthetic_manifest.csv --out demo/synthetic_mask_metrics.csv --sensitivity --sensitivity-thresholds 0.3,0.4,0.5,0.6,0.7 --strict
      - name: Upload synthetic demonstration outputs
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-demo-py${{ matrix.python-version }}
          path: |
            demo/synthetic_morphology.csv
            demo/synthetic_pca.csv
            demo/synthetic_distance_matrix.csv
            demo/synthetic_audit.json
            demo/synthetic_manifest.csv
            demo/synthetic_mask_metrics.csv
            demo/synthetic_mask_metrics.audit.json
          if-no-files-found: error
          retention-days: 7
